version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: frontend-prd
    ports:
      - "3001:3000"
    env_file:
      - .env
    networks:
      - prd-net
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  prd-net:
    external: false
